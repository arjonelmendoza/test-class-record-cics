<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Class Record</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: course list on the left, the selected course on the right with tabs (Class record, ILO attainment, Summary, Course setup). */
:root{
  --bg:#f4f3f3; --surface:#ffffff; --ink:#231f20; --muted:#625b5c; --line:#dcd7d7;
  --accent:#c8102e; --accent-soft:#fbe7ea;
  --pass:#1d7a4a; --pass-bg:#e3f3ea; --warn:#a15c00; --warn-bg:#fdf0dc;
  --fail:#9b1c1c; --fail-bg:#f8e1e1; --inc:#575051; --inc-bg:#ebe8e8;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#161314; --surface:#211d1e; --ink:#f1eded; --muted:#a89fa0; --line:#3a3334;
  --accent:#ff5a6e; --accent-soft:#3a1a20;
  --pass:#6ccf95; --pass-bg:#15301f; --warn:#f0b35a; --warn-bg:#352612;
  --fail:#f28b82; --fail-bg:#3a1a18; --inc:#c2b9ba; --inc-bg:#2c2627; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#161314; --surface:#211d1e; --ink:#f1eded; --muted:#a89fa0; --line:#3a3334;
  --accent:#ff5a6e; --accent-soft:#3a1a20;
  --pass:#6ccf95; --pass-bg:#15301f; --warn:#f0b35a; --warn-bg:#352612;
  --fail:#f28b82; --fail-bg:#3a1a18; --inc:#c2b9ba; --inc-bg:#2c2627; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.5;margin:0}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2{font-family:var(--display);margin:0;text-wrap:balance}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%}
textarea{resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button{font:inherit;font-weight:500;cursor:pointer;border-radius:6px;padding:7px 13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);white-space:nowrap}
button:hover{border-color:var(--accent);color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
button.primary:hover{opacity:.9;color:var(--surface)}
button.armed{background:var(--fail);border-color:var(--fail);color:var(--surface)}
button.link{border:none;background:none;padding:0;color:var(--accent);font-weight:600}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* login */
.login{min-height:100vh;display:grid;place-items:center;padding-block:32px}
.login .card{max-width:420px;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:32px 28px;display:flex;flex-direction:column;gap:14px;text-align:center}
.login h1{color:var(--accent);font-weight:800;font-size:34px}
.login p{margin:0;color:var(--muted)}
.login .fine{font-size:12.5px}
.login .err{color:var(--fail);background:var(--fail-bg);padding:8px 10px;border-radius:6px}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;padding:11px 16px;font-size:15px}

/* top bar */
.bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:12px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{font-family:var(--display);font-weight:800;font-size:20px;color:var(--accent);margin-right:auto}
.save{font-size:12.5px;color:var(--muted)}
.save.err{color:var(--fail);font-weight:600}
.who{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;max-width:260px}
.demo{background:var(--warn-bg);color:var(--warn);font-size:13px;padding-block:8px}

.layout{display:grid;grid-template-columns:240px minmax(0,1fr);gap:22px;padding-block:20px 60px;max-width:1500px;margin:0 auto}
.side{display:flex;flex-direction:column;gap:10px;position:sticky;top:16px;align-self:start}
.side-h{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.clist{display:flex;flex-direction:column;gap:6px}
.citem{display:flex;flex-direction:column;align-items:flex-start;gap:0;text-align:left;white-space:normal;padding:9px 12px}
.citem b{font-size:14.5px}
.citem span{font-size:12.5px;color:var(--muted);font-weight:400;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.citem.on{border-color:var(--accent);background:var(--accent-soft)}
.citem.on b{color:var(--accent)}
.csel{display:none}
.main{min-width:0;display:flex;flex-direction:column;gap:16px}
@media (max-width:900px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .side{position:static;flex-direction:row;flex-wrap:wrap;align-items:center}
  .side-h,.clist{display:none}
  .csel{display:block;flex:1 1 200px;min-width:0}
}

.chead h1{font-size:clamp(24px,3.4vw,32px);font-weight:800}
.chead p{margin:2px 0 0;color:var(--muted);max-width:75ch}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{border:none;border-bottom:3px solid transparent;border-radius:0;background:none;padding:9px 12px;color:var(--muted)}
.tab.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.tab:hover{color:var(--accent)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h2{font-size:18px;font-weight:600}
.card .hint{font-size:13px;color:var(--muted);margin:0}
.row2{display:grid;grid-template-columns:180px minmax(0,1fr);gap:12px}
@media (max-width:640px){.row2{grid-template-columns:minmax(0,1fr)}}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600}
label.f input,label.f textarea,label.f select{text-transform:none;letter-spacing:0;font-size:14px;font-weight:400;color:var(--ink)}
.inline{display:flex;flex-wrap:wrap;gap:12px;align-items:end}
.inline label.f{width:170px}

.secbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.secbar .lbl{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-right:4px}
.schip{border-radius:999px;padding:5px 13px}
.schip small{color:var(--muted);font-family:var(--mono);margin-left:4px}
.schip.on{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.schip.on small{color:var(--surface);opacity:.8}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tools .grow{flex:1}
.warnbox{font-size:13.5px;padding:10px 12px;border-radius:8px;background:var(--warn-bg);color:var(--warn)}
.empty{padding:28px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:10px;display:flex;flex-direction:column;gap:10px;align-items:center}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface);max-width:100%}
table{border-collapse:separate;border-spacing:0;width:100%}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:center;vertical-align:middle}
th{font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--surface);position:sticky;top:0;z-index:2}
tbody tr:last-child td{border-bottom:none}
td.l,th.l{text-align:left}
.rec td{white-space:nowrap}
.rec .sticky{position:sticky;background:var(--surface);z-index:1}
.rec th.sticky{z-index:3}
.rec .c0{left:0;width:40px;min-width:40px;color:var(--muted);font-family:var(--mono)}
.rec .c1{left:40px;width:112px;min-width:112px}
.rec .c2{left:152px;width:230px;min-width:230px;border-right:1px solid var(--line)}
.rec td input{padding:5px 6px}
.rec input.sr{font-family:var(--mono);font-size:13px}
.rec input.sc{width:58px;text-align:center;font-family:var(--mono)}
.rec input.sc.bad{border-color:var(--fail);background:var(--fail-bg)}
.rec input.sc.blank{border-style:dashed}
.rec th.tk{min-width:84px;text-transform:none;letter-spacing:0}
.tk .tn{font-size:12.5px;color:var(--ink);font-weight:600;white-space:normal;line-height:1.25}
.tk .tm{font-size:11px;color:var(--muted);font-family:var(--mono);font-weight:500;white-space:nowrap}
.given{font-size:10.5px;padding:1px 8px;border-radius:999px;margin-top:3px;text-transform:uppercase;letter-spacing:.04em}
.given.on{background:var(--pass-bg);color:var(--pass);border-color:var(--pass)}
.rec td.o{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:13px}
.rec th.ob,.rec td.ob{border-left:1px solid var(--line)}
@media (max-width:640px){.rec .c0{width:32px;min-width:32px}.rec .c1{position:static;width:100px;min-width:100px}.rec .c2{left:32px;width:150px;min-width:150px}}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-weight:600;font-size:12.5px;white-space:nowrap}
.st-pass{color:var(--pass);background:var(--pass-bg)}
.st-rem{color:var(--warn);background:var(--warn-bg)}
.st-fail{color:var(--fail);background:var(--fail-bg)}
.st-inc{color:var(--inc);background:var(--inc-bg)}
.rm{padding:4px 8px;border:none;background:none;color:var(--muted);font-size:17px;line-height:1}
.rm:hover{color:var(--fail)}
.rm.armed{color:var(--surface);background:var(--fail);font-size:12px;border-radius:5px}
.setup td input,.setup td select{padding:6px 8px}
.setup td.w{width:92px}.setup td.w input{text-align:center;font-family:var(--mono)}
.foot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px}
.wsum{font-family:var(--mono);font-size:13.5px}
.wsum.off{color:var(--fail);font-weight:600}

/* ILO + summary */
.att{font-family:var(--mono);font-size:13px}
.ok{color:var(--pass);font-weight:600}
.no{color:var(--fail);font-weight:600}
.cell-ok{background:var(--pass-bg)}
.cell-no{background:var(--fail-bg)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.tile b{display:block;font-family:var(--display);font-weight:800;font-size:30px;line-height:1.1}
.tile span{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.dist{display:flex;flex-direction:column;gap:6px}
.dr{display:grid;grid-template-columns:52px minmax(0,1fr) 40px;gap:10px;align-items:center;font-family:var(--mono);font-size:13px}
.dr .track{height:14px;background:var(--bg);border-radius:4px;overflow:hidden}
.dr .fill{height:100%;background:var(--accent);border-radius:4px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:760px){.two{grid-template-columns:minmax(0,1fr)}}
.plist{margin:0;padding-left:18px;font-size:13.5px}
.plist li{margin:2px 0}
.sm{font-size:12.5px;color:var(--muted)}
/* phase 1: alerts, student panel, checks, insights */
.alcell{background:none;border:none;padding:2px 0;cursor:pointer;display:flex;flex-wrap:wrap;gap:4px;min-width:130px;max-width:220px;white-space:normal}
.alcell .pill{font-size:11px;padding:1px 8px}
.alcell:hover{color:inherit}
.alcell .none{font-size:12px;color:var(--muted)}
.nobtn{background:none;border:none;padding:2px 4px;font-family:var(--mono);color:var(--accent);text-decoration:underline dotted;text-underline-offset:3px}
.checks{background:var(--warn-bg);color:var(--ink);border-radius:8px;padding:10px 14px;font-size:13.5px}
.checks summary{cursor:pointer;font-weight:600;color:var(--warn)}
.checks ul{margin:8px 0 2px;padding-left:18px}
.checks li{margin:2px 0}
.panel{border-color:var(--accent);border-width:2px}
.panel .ph{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.panel .ph h2{margin-right:auto}
.kv{display:flex;flex-wrap:wrap;gap:8px 22px}
.kv div{display:flex;flex-direction:column}
.kv span{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.kv b{font-family:var(--mono);font-size:18px;font-variant-numeric:tabular-nums}
.alist{margin:0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.alist li{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.tgts{list-style:none;margin:6px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px}
.tgts li{display:flex;justify-content:space-between;gap:10px;padding:6px 10px;border-radius:6px;background:var(--bg);font-size:13px}
.tgts li b{font-family:var(--mono)}
.flag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;margin:1px 2px;white-space:nowrap}
.cqi{border-left:4px solid var(--fail);padding:4px 0 4px 14px;display:flex;flex-direction:column;gap:6px}
.cqi h3{margin:0;font-size:15px}
.cqi ul{margin:0;padding-left:18px;font-size:13.5px}
.cqi li{margin:3px 0}
.rec tr.drp td{background:var(--inc-bg)}
.rec tr.drp td input{color:var(--muted);background:transparent}
.rec tr.drp td input[data-f="name"]{text-decoration:line-through}
.rec tr.drp td.o,.rec tr.drp td.c0{color:var(--muted)}
.rec th.ng,.rec td.ng{background:var(--inc-bg)}
.rec td.ng input.sc{background:transparent;border-style:dotted;cursor:not-allowed}
.rec td.ng input.sc::placeholder{color:var(--muted);font-size:11px;font-family:var(--body)}
.sidetools{display:flex;gap:6px}
.sidetools button{flex:1;font-size:13px;padding:6px 8px}
.termh{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-top:6px}
.arch{font-size:13px;color:var(--muted);background:none;border:1px dashed var(--line)}
.citem.archived{opacity:.75}
.archbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--inc-bg);border-radius:8px;padding:10px 14px;font-size:13.5px}
.offline{background:var(--warn-bg);color:var(--warn);font-size:13px;padding-block:8px}
.dlg-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:30;padding:16px}
.dlg{max-width:560px;width:100%;max-height:85vh;overflow:auto}
.dlg ul{margin:0;padding-left:18px;font-size:13.5px}
.search{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.search input{width:260px;max-width:100%}
.cmp td.v{font-family:var(--mono);font-size:13px}
.cmp .bar{display:inline-block;height:8px;border-radius:4px;background:var(--accent);vertical-align:middle;margin-left:6px}
.rkctl,.exctl{display:flex;flex-wrap:wrap;gap:12px;align-items:end}
.rkctl label.f,.exctl label.f{width:auto;min-width:160px}
.parts{display:flex;flex-direction:column;gap:6px}
.prow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13.5px}
.prow input{width:80px;text-align:center;font-family:var(--mono)}
.stat{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1.4fr);gap:4px 14px;font-size:13.5px}
.okline{color:var(--pass);font-size:13px}.badline{color:var(--fail);font-size:13px;font-weight:600}
#exOut td.num,#tabc .rkctl+p+div td.num{white-space:nowrap}
.estnote{font-size:13px;background:var(--accent-soft);border-radius:8px;padding:8px 12px}
.dlg.wide{max-width:860px}
.fmgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.dtab td,.dtab th{padding:4px 6px}
.dtab input[type=date]{width:auto;padding:4px 6px;font-size:13px}
#printArea{position:absolute;left:-10000px;top:0;width:900px}
@media print{
  body>*:not(#printArea){display:none!important}
  #printArea{position:static;left:auto;width:auto}
  #printArea .docx-wrapper{background:none!important;padding:0!important}
  #printArea section.docx{box-shadow:none!important;margin:0 auto!important}
  @page{margin:0}
}
.schedbox{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13.5px}
.schedbox .stxt{color:var(--ink)}.schedbox .stxt.none{color:var(--muted)}
.srow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:8px}
.days{display:flex;gap:4px;flex-wrap:wrap}
.days button{padding:4px 8px;font-size:12.5px;border-radius:999px}
.days button.on{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.srow input[type=time]{width:auto;padding:5px 6px}
.srow .note{width:150px}.srow .free{flex:1;min-width:200px}
.exopt{display:flex;flex-direction:column;gap:10px;font-size:14px}
.exopt label{display:flex;gap:8px;align-items:center}
.exopt input[type=radio],.exopt input[type=checkbox]{width:auto}
.stsel{width:auto;padding:4px 6px;font-size:12.5px}
.stsel.drp{color:var(--fail);border-color:var(--fail);font-weight:600}
.filt{display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:13.5px}
.filt select{width:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:13.5px;z-index:40;display:flex;align-items:center;gap:14px;max-width:calc(100vw - 32px)}
.toast button{background:none;border:1px solid currentColor;color:inherit;padding:3px 12px;font-weight:600}
.toast button:hover{color:inherit;opacity:.8}

/* ===== UI redesign: phases 1–3, dark mode, backup reminder, grade slips ===== */
:root{--edit:#fff7d6;--shadow:0 10px 28px rgba(35,31,32,.16)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--edit:#3a3214;--shadow:0 10px 28px rgba(0,0,0,.5)}}
:root[data-theme="dark"]{--edit:#3a3214;--shadow:0 10px 28px rgba(0,0,0,.5)}
.iconbtn{display:inline-grid;place-items:center;width:38px;height:36px;padding:0}
.iconbtn svg{width:18px;height:18px}
.bar button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.remind{background:var(--accent-soft);color:var(--ink);font-size:13.5px;padding-block:8px;display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap}
.remind span{flex:1 1 260px}
.remind button{padding:5px 12px;font-size:13px}
/* menus */
.menu{position:relative}
.menu>summary{list-style:none;cursor:pointer;font-weight:500;border-radius:6px;padding:7px 13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);white-space:nowrap;user-select:none}
.menu>summary::-webkit-details-marker{display:none}
.menu>summary::after{content:"";display:inline-block;width:6px;height:6px;margin-left:8px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:translateY(-3px) rotate(45deg)}
.menu>summary:hover,.menu[open]>summary{border-color:var(--accent);color:var(--accent)}
.menu .mlist{position:absolute;top:calc(100% + 4px);left:0;z-index:15;width:270px;max-width:calc(100vw - 32px);background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:6px;display:flex;flex-direction:column;gap:2px}
.menu.right .mlist{left:auto;right:0}
.menu .mlist button{border:none;text-align:left;padding:8px 10px;border-radius:6px;display:flex;flex-direction:column;align-items:flex-start;gap:1px;white-space:normal;width:100%}
.menu .mlist button small{font-weight:400;color:var(--muted);font-size:12px;line-height:1.35}
.menu .mlist button:hover{background:var(--accent-soft)}
.menu .mlist button.armed{background:var(--fail);color:var(--surface)}
.menu .mlist button.armed small{color:var(--surface)}
.menu .mlist hr{border:none;border-top:1px solid var(--line);margin:4px 2px}

/* settings */

/* student cards (phones) */

.recbottom{position:sticky;bottom:0;z-index:5;display:flex;gap:10px;padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(to bottom,transparent,var(--bg) 30%)}

#setBtn{display:inline-flex;align-items:center;gap:7px}
@media (max-width:700px){
  .bar{gap:8px 10px;flex-wrap:nowrap}.who{display:none}.brand{font-size:18px;white-space:nowrap}.save{font-size:11.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  ilos:[{id:uid(),code:"ILO1",desc:"",pass:"",target:""}],tasks:[],sections:[{id:uid(),name:"Section 1",students:[],given:{}}]}}

/* ---------- storage ---------- */
const LK="classrecord.demo.v1";
const localStore={
  async loadAll(){try{const d=JSON.parse(localStorage.getItem(LK));if(Array.isArray(d))return d}catch(e){}return null},
  async save(){localStorage.setItem(LK,JSON.stringify(courses))},

  async saveProfile(){localStorage.setItem(LK+".profile",JSON.stringify(profile))}
};
function fireStore(u){
  const base=firebase.firestore().collection("users").doc(u.uid),col=base.collection("courses"),tcol=base.collection("templates"),pdoc=base.collection("meta").doc("profile");
  return{
    async loadAll(){const s=await col.get();return s.docs.map(d=>d.data())},
    save(c){c.updatedAt=Date.now();return queued(col.doc(c.id).set(JSON.parse(JSON.stringify(c))))},
    remove(id){return queued(col.doc(id).delete())},
    async loadTemplates(){const s=await tcol.get();return s.docs.map(d=>d.data())},
    saveTemplate(t){return queued(tcol.doc(t.id).set(JSON.parse(JSON.stringify(t))))},
    removeTemplate(id){return queued(tcol.doc(id).delete())},
    async loadProfile(){const d=await pdoc.get();return d.exists?d.data():{}},
    saveProfile(){return queued(pdoc.set(JSON.parse(JSON.stringify(profile))))}

const pending=new Set();let saveTimer,unsynced=0;
function queued(pr){
  /* With the offline cache, a write is stored on this device at once; the promise only settles when the server confirms. */
  return Promise.race([pr.then(()=>"ok"),new Promise(r=>setTimeout(()=>r("queued"),4000))]).then(x=>{
    if(x==="queued"){unsynced++;pr.then(()=>{unsynced=Math.max(0,unsynced-1);if(!unsynced&&!pending.size)setSave("All changes saved")}).catch(e=>{console.error(e);setSave("Some changes were not saved. Reload the page.",true)})}
    return x});
}
function savedLabel(){return DEMO?"Saved on this device":(!navigator.onLine||unsynced)?"Offline: saved on this device, will sync when online":"All changes saved"}

function setSave(t,err){const el=$("#save");if(el){el.textContent=t;el.classList.toggle("err",!!err)}}
function dirty(c=cur()){if(!c)return;pending.add(c.id);setSave("Saving…");clearTimeout(saveTimer);saveTimer=setTimeout(flush,700)}
async function flush(){
  const ids=[...pending];pending.clear();
  try{for(const id of ids){const c=courses.find(x=>x.id===id);if(c)await store.save(c)}if(!pending.size)setSave(savedLabel())}
  catch(e){console.error(e);ids.forEach(i=>pending.add(i));setSave("Not saved. Check your connection.",true);clearTimeout(saveTimer);saveTimer=setTimeout(flush,5000)}

const DAY=86400000;
function backupDue(){
  if(!courses.some(c=>c.sections.some(s=>s.students.length)))return null;
  let snooze=0;try{snooze=+localStorage.getItem("classrecord.bkSnooze")||0}catch(e){}
  if(Date.now()<snooze)return null;
  const last=+profile.lastBackup||0;
  if(!last)return"You haven't downloaded a backup yet. Keep a copy of your records outside the system.";
  const d=Math.floor((Date.now()-last)/DAY);
  return d>=7?`Your last backup was ${d} days ago (${new Date(last).toLocaleDateString("en-US",{month:"long",day:"numeric"})}).`:null;
}
function paintReminder(){
  const el=$("#bkRemind");if(!el)return;const msg=backupDue();el.hidden=!msg;if(!msg)return;

  $("#bkNow").onclick=backup;

/* ---------- grade computation ---------- */
function weightSum(c){return c.tasks.reduce((a,t)=>{const w=num(t.weight);return a+(w>0?w:0)},0)}
const weightOk=c=>c.tasks.length>0&&Math.abs(weightSum(c)-100)<1e-6;
function calc(c,st){
  let acc=0,wMiss=0,bad=0,wS=0;const miss=[],ilo={};
  for(const t of c.tasks){
    const w=num(t.weight),T=num(t.total);if(!(w>0)||!(T>0))continue;
    let s=num(st.scores?.[t.id]);
    if(s===null){miss.push(t);wMiss+=w;continue}
    if(Number.isNaN(s)||s<0||s>T){bad++;wMiss+=w;continue}
    const tr=s/T*62.5+37.5;acc+=tr*w/100;wS+=w;
    if(t.iloId){const a=ilo[t.iloId]||(ilo[t.iloId]={n:0,d:0});a.n+=tr*w;a.d+=w}
  }
  const complete=!miss.length&&!bad&&weightOk(c);
  const final=complete?Math.floor(acc+1e-9):null;
  const iloS={};for(const k in ilo)iloS[k]=ilo[k].n/ilo[k].d;
  return{acc,miss,bad,complete,final,eq:final!==null?equiv(final):null,
    status:bad?["Check","st-fail"]:complete?statusOf(final):["INC","st-inc"],
    hi:Math.floor(acc+wMiss+1e-9),iloS,wScored:wS,curAvg:wS>0?acc/wS*100:null};
}
const iloPass=(c,i)=>{const v=num(i.pass);return v===null||Number.isNaN(v)?(num(c.defPass)??75):v};
const iloTarget=(c,i)=>{const v=num(i.target);return v===null||Number.isNaN(v)?(num(c.defTarget)??70):v};
const iloCode=(c,id)=>c.ilos.find(i=>i.id===id)?.code||"—";
/* ---------- tasks that cover several ILOs ----------
   Stored as one task per ILO part, linked by t.grp = {id, w: task weight, mode: "points"|"percent", v: this ILO's points or percent}.
   Each part's weight (and, in points mode, its total) is computed, so grading works like any other task. */
const ILO_COLORS=["#c8102e","#e0798b","#7a0a1c","#8a8384","#c77700","#2f6f8f","#4f8a3a","#6b4fa0"];
const iloColor=(c,id)=>{const i=c.ilos.findIndex(x=>x.id===id);return i<0?"#b9b2b3":ILO_COLORS[i%ILO_COLORS.length]};
const wFmt=v=>{const n=num(v);return n===null||Number.isNaN(n)?String(v??""):String(+n.toFixed(2))};
function taskEntries(c){
  const out=[],seen={};
  c.tasks.forEach(t=>{if(t.grp&&t.grp.id){if(seen[t.grp.id]){seen[t.grp.id].members.push(t);return}const e={id:t.grp.id,grp:true,members:[t]};seen[t.grp.id]=e;out.push(e)}else out.push({id:t.id,grp:false,members:[t]})});
  return out;
}
const entryWeight=e=>{const v=num(e.grp?e.members[0].grp.w:e.members[0].weight);return v>0?v:0};
const groupOfTask=(c,t)=>t.grp&&t.grp.id?c.tasks.filter(x=>x.grp&&x.grp.id===t.grp.id):[t];
function regroup(c,gid){
  const M=c.tasks.filter(x=>x.grp&&x.grp.id===gid);if(!M.length)return;
  const W=num(M[0].grp.w),mode=M[0].grp.mode==="percent"?"percent":"points";
  const vals=M.map(m=>{const v=num(m.grp.v);return v>0?v:0}),S=vals.reduce((a,b)=>a+b,0);
  M.forEach((m,i)=>{m.grp.w=M[0].grp.w;m.grp.mode=mode;m.name=M[0].name;m.weight=S>0&&W>0?W*vals[i]/S:0;if(mode==="points")m.total=m.grp.v??""});
}
function groupGrade(c,st,M){
  let acc=0,W=0;for(const t of M){const w=num(t.weight),tr=trOf(t,st);if(!(w>0))continue;if(tr===null)return null;acc+=tr*w/100;W+=w}
  return W>0?{pts:acc,W,grade:acc/W*100}:null;
}
const taskLabel=(c,t)=>`${t.name||"Task"}${c.tasks.filter(x=>x.name===t.name).length>1?` (${iloCode(c,t.iloId)})`:""}`;

/* ---------- phase 1 rules ---------- */
function trOf(t,st){const T=num(t.total),s=num(st.scores?.[t.id]);if(!(T>0)||s===null||Number.isNaN(s)||s<0||s>T)return null;return s/T*62.5+37.5}
function targetsFor(c,r,goal){
  if(r.complete||r.bad)return null;
  const pend=r.miss.filter(t=>num(t.weight)>0&&num(t.total)>0);const R=pend.reduce((a,t)=>a+num(t.weight),0);if(R<=0)return null;
  if(r.acc+0.375*R>=goal)return{secured:true,lo:Math.floor(r.acc+0.375*R+1e-9)};
  if(r.acc+R<goal)return{unreachable:true};
  const f=Math.max(0,((goal-r.acc)/R*100-37.5)/62.5);
  return{f,list:pend.map(t=>({t,T:num(t.total),need:Math.min(num(t.total),Math.ceil(f*num(t.total)-1e-9))}))};
}
function alertsOf(c,st,r,sec){
  const a=[];
  if(!r.complete&&!r.bad&&r.hi<75){const rm=targetsFor(c,r,70);a.push(["Cannot pass","st-fail",`Highest possible is ${r.hi}% (${equiv(r.hi)}) even with perfect scores on the remaining tasks.${rm&&rm.list?` Needs about ${Math.ceil(rm.f*100)}% of the points on the remaining tasks to reach REM (70%).`:rm&&rm.secured?" Already sure to reach at least REM (70%).":" Cannot reach REM (70%) either."}`])}
  else{const tg=targetsFor(c,r,75);if(tg&&tg.f>=0.8)a.push(["Narrow path","st-rem",`Needs about ${Math.ceil(tg.f*100)}% of the points on every remaining task to pass.`])}
  const seq=c.tasks.map(t=>({t,tr:trOf(t,st)})).filter(x=>x.tr!==null);let drop=null;
  for(let i=0;i<seq.length;i++){const j=seq.findIndex((x,k)=>k>i&&num(x.t.weight)===num(seq[i].t.weight));if(j>0&&seq[i].tr-seq[j].tr>=15)drop=[seq[i],seq[j]]}
  if(drop)a.push(["Dropping","st-rem",`${taskLabel(c,drop[0].t)} ${fmt(drop[0].tr)} → ${taskLabel(c,drop[1].t)} ${fmt(drop[1].tr)}.`]);
  const mo=c.tasks.filter(t=>isGiven(sec,t)&&num(st.scores?.[t.id])===null);
  if(mo.length)a.push(["No score yet","st-inc",`No score yet for ${mo.map(t=>taskLabel(c,t)).join(", ")}, already given. Enter the score, or type 0 if there was no output.`]);
  return a;
}
function taskStats(c,sec){
  return c.tasks.map(t=>{
    const T=num(t.total);const vals=[];let blanks=0,bad=0;
    activeOf(sec).forEach(st=>{const s=num(st.scores?.[t.id]);if(s===null){blanks++;return}if(Number.isNaN(s)||s<0||!(T>0)||s>T){bad++;return}vals.push(s)});
    const given=isGiven(sec,t);if(!(T>0)||!vals.length)return{t,T,n:0,blanks,bad,given};
    const trs=vals.map(v=>v/T*62.5+37.5),passN=trs.filter(x=>x>=75).length;
    return{t,T,n:vals.length,blanks,bad,given,avg:vals.reduce((a,b)=>a+b,0)/vals.length,hi:Math.max(...vals),lo:Math.min(...vals),passN,passRate:passN/vals.length*100};
  });
}
function dataChecks(c,sec){
  const out=[];const T=Object.fromEntries(c.tasks.map(t=>[t.id,t]));
  sec.students.forEach((st,i)=>{
    const who=st.name||st.sr||`Row ${i+1}`;
    if(!isDrp(st))for(const id in (st.scores||{})){const t=T[id];if(!t)continue;const s=num(st.scores[id]),tot=num(t.total);
      if(s!==null&&(Number.isNaN(s)||s<0))out.push(`${who}: ${taskLabel(c,t)} score "${st.scores[id]}" is not a valid number.`);
      else if(s!==null&&tot>0&&s>tot)out.push(`${who}: ${taskLabel(c,t)} score ${s} is higher than the total of ${tot}.`)}
    if(!st.name.trim()||!st.sr.trim())out.push(`Row ${i+1}: ${!st.name.trim()&&!st.sr.trim()?"name and SR-Code are":!st.name.trim()?"name is":"SR-Code is"} missing.`);
  });
  const seen={};sec.students.forEach(st=>{const k=st.sr.trim().toLowerCase();if(k)(seen[k]=seen[k]||[]).push(st.name||"(no name)")});
  Object.entries(seen).forEach(([k,v])=>{if(v.length>1)out.push(`SR-Code ${k.toUpperCase()} is used by ${v.length} students: ${v.join("; ")}`)});
  const given=c.tasks.filter(t=>isGiven(sec,t));
  if(given.length)activeOf(sec).forEach(st=>{if(given.every(t=>num(st.scores?.[t.id])===null))out.push(`${st.name||st.sr||"A student"} has no scores on any given task.`)});
  c.tasks.filter(t=>!isGiven(sec,t)).forEach(t=>{const n=activeOf(sec).filter(st=>num(st.scores?.[t.id])!==null).length;if(n)out.push(`${taskLabel(c,t)} is marked Not yet given in this section, but ${n} student${n===1?" has":"s have"} scores in it. These scores still count. Mark it Given to edit them.`)});
  given.forEach(t=>{const A=activeOf(sec);const b=A.filter(st=>num(st.scores?.[t.id])===null).length;if(A.length&&b/A.length>=0.3)out.push(`${taskLabel(c,t)} is marked Given but ${b} of ${A.length} scores are blank. Were the scores encoded?`)});
  return out;
}

const isDrp=st=>st.status==="DRP";

function migrate(c){

/* Tabs: five main tabs; Results and Analysis have sub-tabs. view.tab always holds the leaf. */
const GROUPS=[["overview","Overview",["overview"]],["record","Class record",["record"]],["results","Results",["results"]],["analysis","Analysis",["exam","rank","compare"]],["setup","Course setup",["setup"]]];
const LEAF={overview:"Overview",record:"Class record",results:"Results",exam:"Exam analysis",rank:"Rankings",compare:"Compare sections",setup:"Course setup"};
const groupOf=leaf=>GROUPS.find(g=>g[2].includes(leaf))||GROUPS[1];
function goTab(leaf,sectionId){view.tab=leaf;view.page=null;if(sectionId)view.sectionId=sectionId;view.lastSub=view.lastSub||{};view.lastSub[groupOf(leaf)[0]]=leaf;saveView();render()}
function renderMain(){

  if(!c){m.innerHTML=`<div class="empty"><h2>No courses yet</h2><p>Create your first course to set up its ILOs, assessment tasks and sections.</p><div class="tools" style="justify-content:center"><button class="primary" id="first">+ New course</button><button id="firstImp">Import a co-faculty's setup</button></div></div>`;$("#first").onclick=()=>$("#addCourse").click();$("#firstImp").onclick=()=>openImportSetup(null);return}
  if(["summary","ilo","insights"].includes(view.tab))view.tab="results";

function openSectionSettings(c,sec,isNew){
  const dlg=document.createElement("div");dlg.className="dlg-bg";document.body.appendChild(dlg);

function arm(btn,fn,label="Tap again to confirm"){
  if(btn.classList.contains("armed")){clearTimeout(btn._t);fn();return}
  const old=btn.textContent;btn.classList.add("armed");btn.textContent=label;
  btn._t=setTimeout(()=>{btn.classList.remove("armed");btn.textContent=old},3500);
}

      inp.onkeydown=e=>{if(e.key==="Enter"||(e.key==="ArrowDown")||(e.key==="ArrowUp")){e.preventDefault();const r=+inp.dataset.r+(e.key==="ArrowUp"||(e.key==="Enter"&&e.shiftKey)?-1:1);tc.querySelector(`input.sc[data-r="${r}"][data-c="${inp.dataset.c}"]`)?.focus()}};

        const txt=(e.clipboardData||window.clipboardData).getData("text");if(!/[\t\n]/.test(txt.replace(/\s+$/,"")))return;
        e.preventDefault();const before=snap(c);const r0=+inp.dataset.r,c0=+inp.dataset.c;let n=0;
        txt.replace(/\r/g,"").replace(/\n+$/,"").split("\n").forEach((row,i)=>{const s2=sec.students[r0+i];if(!s2||isDrp(s2))return;s2.scores=s2.scores||{};row.split("\t").forEach((v,j)=>{const t=tasks[c0+j];if(t&&isGiven(sec,t)){s2.scores[t.id]=v.trim();markEnc(sec,t.id);n++}})});
        dirty(c);renderMain();toast(`${n} score${n===1?"":"s"} pasted.`,n?undoer(c,before,"Pasted scores removed."):null);
      };
    });
    const rm=tr.querySelector("[data-rm]");rm.onclick=()=>arm(rm,()=>{const before=snap(c);sec.students=sec.students.filter(s=>s.id!==st.id);dirty(c);renderMain();toast(`${st.name||"Student"} removed.`,undoer(c,before,"Student restored."))},"Remove");
  });
  updateChecks(c,sec);renderPanel(c,sec);
}

/* ---------- overview ---------- */
const dShort=t=>new Date(t).toLocaleDateString("en-US",{month:"short",day:"numeric"});
function renderOverview(c){
  const tc=$("#tabc"),A=[];
  if(c.tasks.length&&!weightOk(c))A.push(["var(--fail)",`Task weights add up to ${pc(weightSum(c))}%. Final grades appear only when they total 100%.`,"Fix weights",()=>goTab("setup")]);
  const cannot={};
  c.sections.forEach(sec=>{
    const act=activeOf(sec);
    c.tasks.filter(t=>isGiven(sec,t)).forEach(t=>{const b=act.filter(st=>num(st.scores?.[t.id])===null).length;
      if(b)A.push(["var(--warn)",`<b>${esc(sec.name)}</b>: ${esc(taskLabel(c,t))} is marked Given but ${b} score${b===1?" is":"s are"} blank.`,"Encode now",()=>{view.sectionId=sec.id;saveView();openFocus(c,sec,t.id)}])});
    let bad=0;act.forEach(st=>{const r=calc(c,st);if(r.bad)bad++;else if(!r.complete&&r.hi<75&&c.tasks.length)cannot[sec.id]=(cannot[sec.id]||0)+1});
    if(bad)A.push(["var(--fail)",`<b>${esc(sec.name)}</b>: ${bad} student${bad===1?" has":"s have"} an invalid score (not a number, or higher than the total).`,"Review",()=>goTab("record",sec.id)]);
  });
  const cn=Object.entries(cannot);
  if(cn.length){const tot=cn.reduce((a,x)=>a+x[1],0),top=cn.sort((a,b)=>b[1]-a[1])[0][0];
    A.push(["var(--fail)",`${tot} student${tot===1?"":"s"} can no longer reach 75 (${cn.map(([id,n])=>`${esc(c.sections.find(s=>s.id===id).name)}: ${n}`).join(", ")}). Talk with them about REM or other options.`,"See list",()=>{view.resScope=top;goTab("results",top)}])}
  const wg=c.sections.filter(s=>c.tasks.some(t=>isGiven(s,t))),lk=wg.filter(s=>s.midLock);
  if(lk.length&&lk.length<wg.length){const un=wg.filter(s=>!s.midLock);A.push(["var(--muted)",`Midterm grades are locked in ${lk.length} of ${wg.length} sections. Not locked yet: ${un.map(s=>esc(s.name)).join(", ")}.`,"Open",()=>goTab("record",un[0].id)])}
  const SH=8;
  const cards=c.sections.map(sec=>{
    const act=activeOf(sec),drp=sec.students.length-act.length;let on=0,rem=0,low=0,inc=0;const mids=[];
    act.forEach(st=>{const m=midOf(c,sec,st);if(m&&m.status==="ok"){mids.push(m.pct);if(m.grade>=75)on++;else if(m.grade>=70)rem++;else low++}else inc++});
    const gN=c.tasks.filter(t=>isGiven(sec,t)).length,T=act.length||1,seg=(n,col)=>n?`<span style="width:${n/T*100}%;background:${col}"></span>`:"";
    const le=sec.lastEnc&&c.tasks.find(t=>t.id===sec.lastEnc.t);
    return`<article class="card scard"><div class="shd"><h3>${esc(sec.name||"Untitled")}</h3><span class="sm">${esc(schedText(sec))}</span></div>
      <div class="stats"><div><span>Active</span><b>${act.length}</b></div>${drp?`<div><span>DRP</span><b>${drp}</b></div>`:""}<div><span>Midterm average</span><b>${mids.length?fmt(mids.reduce((a,b)=>a+b,0)/mids.length,1):"–"}</b></div><div><span>Tasks given</span><b>${gN} of ${c.tasks.length}</b></div></div>
      ${gN&&act.length?`<div><div class="sbar" role="img" aria-label="${on} at 75 and up, ${rem} in REM range, ${low} below 70, ${inc} incomplete">${seg(on,"var(--pass)")}${seg(rem,"var(--warn)")}${seg(low,"var(--fail)")}${seg(inc,"var(--line)")}</div>
        <div class="legend" style="margin-top:6px"><span><b style="color:var(--pass)">${on}</b> 75 and up</span><span><b style="color:var(--warn)">${rem}</b> REM range</span><span><b style="color:var(--fail)">${low}</b> below 70</span><span><b style="color:var(--ink)">${inc}</b> INC</span><span>midterm grades${sec.midLock?" (locked)":" so far"}</span></div></div>`
        :`<p class="hint">${act.length?"No tasks are marked Given in this section yet.":"No students yet. Paste the class list in the Class record."}</p>`}
      <div class="sfoot"><span>Latest encoded: <b style="color:var(--ink)">${le?`${esc(taskLabel(c,le))} · ${dShort(sec.lastEnc.at)}`:"–"}</b></span>${act.length&&c.tasks.length?`<button data-enc="${sec.id}">Encode scores</button>`:""}<button class="primary" data-osec="${sec.id}">Open class record</button></div></article>`;
  }).join("");
  const il=c.ilos.length&&c.sections.length?iloStats(c,{students:c.sections.flatMap(s=>s.students)}).ilos:[];
  tc.innerHTML=`${gsCard(c,"overview")}
    <section class="card" aria-labelledby="atT"><h2 id="atT">Needs your attention</h2>
      ${A.length?`<ul class="attn">${A.slice(0,SH).map(([col,txt,lab],i)=>`<li><span class="dot" style="background:${col}"></span><span>${txt}</span><button class="link" data-ai="${i}">${lab}</button></li>`).join("")}</ul>${A.length>SH?`<p class="sm">…and ${A.length-SH} more. Open each section's Class record to see them.</p>`:""}`
        :`<p class="hint">Nothing needs your attention right now.</p>`}</section>
    ${c.sections.length?`<div class="seccards">${cards}</div>`:""}
    ${il.length?`<section class="card"><h2>ILO attainment, all sections</h2><div class="chips">${il.map(x=>`<span class="pill ${x.result==="Met"?"st-pass":x.result==="Not met"?"st-fail":"st-inc"}">${esc(x.i.code)} · ${x.result==="Pending"?"Pending":`${fmt(x.pct,0)}% · ${x.result}`}</span>`).join("")}</div>
      <p class="hint">Share of active students in all sections who attained each ILO, against its target. See Results for each section, with CQI suggestions.</p></section>`:""}`;
  tc.querySelectorAll("[data-ai]").forEach(b=>b.onclick=()=>A[+b.dataset.ai][3]());
  tc.querySelectorAll("[data-osec]").forEach(b=>b.onclick=()=>goTab("record",b.dataset.osec));
  tc.querySelectorAll("[data-enc]").forEach(b=>b.onclick=()=>{view.sectionId=b.dataset.enc;saveView();openFocus(c,c.sections.find(s=>s.id===b.dataset.enc))});
  bindGs(c);
}

/* ---------- getting-started checklist ---------- */
function gsSteps(c){
  const nStu=c.sections.reduce((a,s)=>a+s.students.length,0),ws=weightSum(c);
  const scored=c.sections.some(s=>c.tasks.some(t=>isGiven(s,t))&&s.students.some(st=>c.tasks.some(t=>num(st.scores?.[t.id])!==null)));
  const nI=c.ilos.length;
  return[
    {t:"Course details",done:!!(c.code||"").trim()&&!!(c.desc||"").trim(),ok:`${c.code} · ${c.desc}${c.term?" · "+c.term:""}`,todo:"Add the course code, description and term.",go:["Open Course setup","setup"]},
    {t:"Intended learning outcomes",done:c.ilos.some(i=>(i.code||"").trim()&&(i.desc||"").trim()),ok:`${nI} ILO${nI===1?"":"s"} · passing level ${c.defPass} · target ${c.defTarget}% of students`,todo:"Write each ILO, then check the passing level and target.",go:["Open Course setup","setup"]},
    {t:"Assessment tasks and weights",done:weightOk(c),ok:`${c.tasks.length} task${c.tasks.length===1?"":"s"} · weights total 100%`,todo:c.tasks.length?`${c.tasks.length} task${c.tasks.length===1?"":"s"} added. Weights total ${pc(ws)}%; they must total 100% before final grades can appear.`:"Add the tasks with their ILO, weight and total points.",bar:true,go:["Open Course setup","setup"],imp:!c.tasks.length},
    {t:"Sections and students",done:nStu>0,ok:`${c.sections.length} section${c.sections.length===1?"":"s"} · ${nStu} student${nStu===1?"":"s"}`,todo:"Add a section, then paste the class list (SR-Code and Name) from Excel.",go:["Open Class record","record"]},
    {t:"First scores",done:scored,ok:"Scores are being recorded.",todo:"Mark a task as Given in a section, then type or paste its scores.",go:["Open Class record","record"]}
  ];
}
function gsCard(c,here){
  const S=gsSteps(c),n=S.filter(x=>x.done).length;if(n===S.length||c.gsHide)return"";
  const now=S.findIndex(x=>!x.done),ws=weightSum(c);
  return`<section class="card gs" aria-labelledby="gsT"><div class="gsh"><div><h2 id="gsT">Get this course ready</h2><p class="hint">Five steps. Each one ticks itself off, and this card goes away when all are done.</p></div>
    <div class="gsp"><span><b style="color:var(--ink)">${n} of ${S.length}</b> done</span><div class="prog"><span style="width:${n/S.length*100}%"></span></div><button class="link" id="gsHide" style="font-size:12.5px;font-weight:500">Hide this checklist</button></div></div>
    <ol>${S.map((x,i)=>`<li class="${x.done?"done":i===now?"now":""}"><span class="n" aria-hidden="true">${x.done?"✓":i+1}</span><div><b>${x.t}</b><span class="sm">${esc(x.done?x.ok:x.todo)}</span>
      ${i===now&&x.bar&&c.tasks.length?`<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><div class="prog" style="max-width:320px;height:10px;flex:1"><span style="width:${Math.min(100,ws)}%"></span></div><b class="num" style="color:var(--accent)">${pc(ws)}% of 100%</b></div>`:""}
      ${i===now&&(x.go[1]!==here||x.imp)?`<div class="tools">${x.go[1]!==here?`<button class="primary" data-gostep="${x.go[1]}">${x.go[0]}</button>`:""}${x.imp?`<button id="gsImp">Import a co-faculty's setup instead</button>`:""}</div>`:""}</div>
      ${x.done?`<span class="sm" style="color:var(--pass);font-weight:600">Done</span>`:""}</li>`).join("")}</ol></section>`;
}
function bindGs(c){
  const tc=$("#tabc");tc.querySelectorAll("[data-gostep]").forEach(b=>b.onclick=()=>goTab(b.dataset.gostep));
  if($("#gsImp"))$("#gsImp").onclick=()=>openImportSetup(c);
  if($("#gsHide"))$("#gsHide").onclick=()=>{c.gsHide=true;dirty(c);renderMain();toast("Checklist hidden. Everything is still in Course setup.")};
}

/* ---------- focus encoding: one task, big score boxes ---------- */
function openFocus(c,sec,taskId){
  if(!sec)return;
  if(!c.tasks.length){toast("Add assessment tasks in Course setup first.");return}
  const given=c.tasks.filter(t=>isGiven(sec,t));
  let tid=taskId||view.focusTask;
  if(!c.tasks.some(t=>t.id===tid)||(!taskId&&!isGiven(sec,c.tasks.find(t=>t.id===tid))))tid=(given.find(t=>activeOf(sec).some(st=>num(st.scores?.[t.id])===null))||given[given.length-1]||c.tasks[0]).id;
  const before=snap(c),touched=new Set();
  const el=document.createElement("div");el.className="focus";el.setAttribute("role","dialog");el.setAttribute("aria-modal","true");el.setAttribute("aria-label","Encode scores");document.body.appendChild(el);
  const ov=document.body.style.overflow;document.body.style.overflow="hidden";
  const onKey=e=>{if(e.key==="Escape"&&!document.querySelector(".dlg-bg"))close()};
  const close=()=>{el.remove();document.removeEventListener("keydown",onKey);document.body.style.overflow=ov;renderMain();
    if(touched.size)toast(`${touched.size} score${touched.size===1?"":"s"} saved.`,undoer(c,before,"Scores from that session removed."))};
  document.addEventListener("keydown",onKey);
  const draw=()=>{
    const t=c.tasks.find(x=>x.id===tid),T=num(t.total),act=activeOf(sec),g=isGiven(sec,t);
    el.innerHTML=`<div class="fh"><div class="fin">
        <div class="ftop"><button class="fx" id="fX" aria-label="Close"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
          <div><div class="sm">${esc(c.code||"Course")} · ${esc(sec.name)}</div><select id="fTask" aria-label="Task to encode">${c.tasks.map(x=>`<option value="${x.id}" ${x.id===tid?"selected":""}>${esc(taskLabel(c,x))}${isGiven(sec,x)?"":" (not yet given)"}</option>`).join("")}</select></div>
          <span class="pill st-inc num">/ ${esc(t.total)}</span></div>
        <div class="fprog"><div class="prog" style="flex:1"><span id="fBar"></span></div><span id="fCnt"></span></div></div></div>
      <div class="fl"><div class="fin">${!g?`<div class="empty"><p><b>${esc(taskLabel(c,t))}</b> is not yet given in ${esc(sec.name)}, so its scores are locked.</p><button class="primary" id="fGive">Mark as Given and start encoding</button></div>`
        :act.length?act.map((st,i)=>`<div class="fr"><div class="nm"><div>${esc(st.name||"(no name)")}</div><div>${esc(st.sr)}</div></div><input inputmode="decimal" autocomplete="off" data-i="${i}" value="${esc(st.scores?.[t.id]??"")}" placeholder="–" aria-label="Score for ${esc(st.name||st.sr)}"></div>`).join("")
        :`<div class="empty"><p>No active students in this section.</p></div>`}</div></div>
      <div class="ff"><div class="fin"><div class="sm" style="text-align:center">Saved as you type · Enter moves to the next student · A blank is not 0: type 0 when there was no output</div>
        <div class="fbtns"><button id="fNext" ${g?"":"disabled"}>Next blank</button><button class="primary" id="fDone">Done</button></div></div></div>`;
    const q=x=>el.querySelector(x),ins=[...el.querySelectorAll(".fr input")];
    const prog=()=>{const n=act.filter(st=>num(st.scores?.[t.id])!==null).length;q("#fCnt").innerHTML=`<b>${n}</b> of ${act.length} encoded`;q("#fBar").style.width=(act.length?n/act.length*100:0)+"%"};
    const paint=inp=>{const v=num(inp.value);inp.classList.toggle("blank",v===null);inp.classList.toggle("bad",v!==null&&(Number.isNaN(v)||v<0||(T>0&&v>T)))};
    ins.forEach(inp=>{const st=act[+inp.dataset.i];paint(inp);
      inp.oninput=()=>{st.scores=st.scores||{};st.scores[t.id]=inp.value;touched.add(st.id+"|"+t.id);markEnc(sec,t.id);dirty(c);paint(inp);prog()};
      inp.onkeydown=e=>{if(e.key==="Enter"||e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();const nx=ins[+inp.dataset.i+(e.key==="ArrowUp"||(e.key==="Enter"&&e.shiftKey)?-1:1)];if(nx){nx.focus();nx.select()}}};
      inp.onfocus=()=>inp.closest(".fr").scrollIntoView({block:"nearest"});
    });
    prog();
    q("#fX").onclick=close;q("#fDone").onclick=close;
    q("#fTask").onchange=e=>{tid=e.target.value;view.focusTask=tid;saveView();draw()};
    q("#fNext").onclick=()=>{const i=ins.indexOf(document.activeElement),order=[...ins.slice(i+1),...ins.slice(0,i+1)],nx=order.find(x=>num(x.value)===null);if(nx)nx.focus();else toast("No blank scores left in this task.")};
    if(q("#fGive"))q("#fGive").onclick=()=>{setGiven(c,sec,t,true,todayISO());dirty(c);draw()};
    const first=ins.find(x=>num(x.value)===null)||ins[0];if(first)first.focus();else q("#fTask").focus();
  };
  draw();
}

/* ---------- student cards (phones) ---------- */
const NARROW=window.matchMedia?matchMedia("(max-width:700px)"):{matches:false};
const cardsMode=()=>view.recView==="cards"||(view.recView!=="table"&&NARROW.matches);
try{NARROW.addEventListener("change",()=>{if(view.recView||!cur()||view.page||view.tab!=="record"||!$("#main")||inAdmin())return;const a=document.activeElement;if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))return;renderMain()})}catch(e){}
function cardsHTML(c,sec){
  const given=c.tasks.filter(t=>isGiven(sec,t));
  return`<div class="scards" id="recList">${sec.students.map(st=>{
    const hid=view.filter==="active"&&isDrp(st)||view.filter==="drp"&&!isDrp(st)?"hidden":"";
    const head=(k,big,small)=>`<div class="ct"><div><div class="nm">${esc(st.name||"(no name)")}</div><div class="sr">${esc(st.sr)}</div></div><div class="gbadge ${k}"><b>${big}</b><span>${small}</span></div></div>`;
    if(isDrp(st))return`<button class="stcard drp" data-card="${st.id}" data-st="${st.id}" ${hid}>${head("","DRP","dropped")}</button>`;
    const r=calc(c,st),m=midOf(c,sec,st);let big="–",small="no grade yet",k="";
    if(r.complete){big=r.eq;small=`Final ${r.final}%`;k=gradeCls(r.final)}
    else if(r.bad){big="Check";small="invalid score";k="g-fail"}
    else if(m&&m.status==="ok"){big=m.eq;small=`Midterm ${m.grade}%`;k=gradeCls(m.grade)}
    else if(m&&m.status==="INC"){big="INC";small="midterm";k="g-inc"}
    const al=alertsOf(c,st,r,sec)[0],done=given.filter(t=>num(st.scores?.[t.id])!==null).length;
    return`<button class="stcard ${k}" data-card="${st.id}" data-st="${st.id}" ${hid}>${head(k,esc(big),esc(small))}
      <div class="meta"><span>Scores <b>${done} of ${given.length}</b> given tasks</span><span>Highest possible <b>${r.complete?"–":`${r.hi}% · ${equiv(r.hi)}`}</b></span></div>
      ${al?`<div class="al ${al[1]}"><b>${esc(al[0])}.</b> ${esc(al[2])}</div>`:""}</button>`;
  }).join("")}</div>
  <p class="sm">Tap a student to see their details and the scores they need. Use <b>Encode scores</b> to enter a task's scores, or switch to the table in <b>View</b>.</p>
  <div class="recbottom"><button id="cardSlip">Grade slips</button><button class="primary" id="cardEnc">Encode scores</button></div>`;
}

/* ---------- grade slips ---------- */
function slipHTML(c,sec,st,o){
  const r=calc(c,st),m=midOf(c,sec,st),[mg,me]=midText(m),date=new Date().toLocaleDateString("en-US",{month:"long",day:"numeric",year:"numeric"});
  const rows=c.tasks.filter(t=>o.notGiven||isGiven(sec,t)||num(st.scores?.[t.id])!==null).map(t=>{
    const v=num(st.scores?.[t.id]),tr=trOf(t,st);
    const sc=v===null?(isGiven(sec,t)?"No score yet":"Not yet given"):Number.isNaN(v)||tr===null?`${esc(st.scores[t.id])} (check)`:`${esc(st.scores[t.id])} / ${esc(t.total)}`;
    return`<tr><td>${esc(taskLabel(c,t))}</td><td>${esc(iloCode(c,t.iloId))}</td><td>${esc(wFmt(t.weight))}%</td><td>${sc}</td><td>${tr===null?"–":fmt(tr)}</td></tr>`}).join("");
  const list=x=>x.list.map(y=>`${esc(taskLabel(c,y.t))} ${y.need}/${y.T}`).join("; ");
  let need;const tg=targetsFor(c,r,75);
  if(r.bad)need="Some scores need checking before targets can be computed.";
  else if(r.complete)need=`Final grade: <b>${r.final} (${r.eq})</b> · ${statusOf(r.final)[0]}.`;
  else if(!tg)need="";

   The page only asks Firebase whether the signed-in account may read config/admin. */
let isAdminUser=false,ADM=null;
const modePref=()=>{try{return localStorage.getItem("classrecord.mode")==="admin"?"admin":"faculty"}catch(e){return"faculty"}};

function fireAdmin(u){
  const db=firebase.firestore();
  return{
    async check(){try{await db.collection("config").doc("admin").get();return true}catch(e){return false}},
    async blockedSelf(){const d=await db.collection("blocked").doc(u.uid).get();return d.exists?d.data():null},
    async readDirSelf(){const d=await db.collection("directory").doc(u.uid).get();return d.exists?d.data():null},
    writeDir(rec){return queued(db.collection("directory").doc(u.uid).set(rec,{merge:true}))},
    async listDir(){const s=await db.collection("directory").get();return s.docs.map(d=>({uid:d.id,...d.data()}))},
    async listBlocked(){const [a,b]=await Promise.all([db.collection("blocked").get(),db.collection("blockedNotes").get()]);const notes={};b.docs.forEach(d=>notes[d.id]=d.data());return a.docs.map(d=>({uid:d.id,...d.data(),reason:notes[d.id]?.reason||""}))},
    async block(uid,info,reason){const bt=db.batch();bt.set(db.collection("blocked").doc(uid),info);bt.set(db.collection("blockedNotes").doc(uid),{reason});await bt.commit()},
    async unblock(uid){const bt=db.batch();bt.delete(db.collection("blocked").doc(uid));bt.delete(db.collection("blockedNotes").doc(uid));await bt.commit()},
    async listAnn(){const s=await db.collection("announcements").get();return s.docs.map(d=>({id:d.id,...d.data()}))},
    saveAnn(a){const {id,...rest}=a;return db.collection("announcements").doc(id).set(rest)},
    delAnn(id){return db.collection("announcements").doc(id).delete()},
    async seenCounts(id){const s=await db.collection("announcements").doc(id).collection("seen").get();let d=0;s.docs.forEach(x=>{if(x.data().dismissed)d++});return{seen:s.size,dismissed:d}},
    markSeen(id,dismissed){return db.collection("announcements").doc(id).collection("seen").doc(u.uid).set({at:Date.now(),...(dismissed?{dismissed:true}:{})},{merge:true}).catch(e=>console.warn(e))}
  };
}

/* ---------- paste scores ---------- */
const normT=v=>String(v??"").toLowerCase().replace(/\s+/g," ").trim();
function parseScorePaste(c,sec,txt){
  const lines=txt.replace(/\r/g,"").split("\n").filter(l=>l.trim());
  const rows=lines.map(l=>l.includes("\t")?l.split("\t").map(x=>x.trim()):l.trim().split(/\s+/));
  if(!rows.length)return{error:"Paste at least one row first."};
  const bySr=new Map(sec.students.filter(s=>s.sr.trim()).map(s=>[normT(s.sr),s]));
  const byName=new Map(sec.students.filter(s=>s.name.trim()).map(s=>[normT(s.name),s]));
  const ncol=Math.max(...rows.map(r=>r.length));
  let srCol=-1,nmCol=-1,bs=0,bn=0;
  for(let j=0;j<ncol;j++){
    const a=rows.filter(r=>bySr.has(normT(r[j]))).length;if(a>bs){bs=a;srCol=j}
    const b=rows.filter(r=>byName.has(normT(r[j]))).length;if(b>bn){bn=b;nmCol=j}
  }
  if(srCol<0&&nmCol<0)return{error:"None of the SR-Codes or names in the pasted text match students in this section. Check that you selected the right section, and that the SR-Code or Name column is included."};
  const keyCol=srCol>=0?srCol:nmCol,idEnd=Math.max(srCol,nmCol);
  const match=r=>(srCol>=0&&bySr.get(normT(r[srCol])))||(nmCol>=0&&byName.get(normT(r[nmCol])))||null;
  const firstData=rows.findIndex(r=>match(r));
  const head=rows.slice(0,Math.max(0,firstData));
  const data=rows.slice(Math.max(0,firstData));
  const cols=[];
  for(let j=idEnd+1;j<ncol;j++){
    const vals=data.filter(r=>match(r)).map(r=>(r[j]??"").trim()).filter(v=>v!=="");
    if(!vals.length)continue;
    const numeric=vals.filter(v=>!Number.isNaN(num(v))&&num(v)!==null).length;
    if(numeric/vals.length<0.7)continue;
    const htxt=head.map(r=>r[j]||"").join(" ");
    cols.push({j,head:htxt.trim(),taskId:guessTask(c,htxt)});
  }
  if(!cols.length)return{error:"No score columns were found. Include at least one column of scores to the right of the SR-Code or Name column."};
  const items=[],unmatched=[];
  data.forEach(r=>{
    const st=match(r);
    if(st){items.push({st,vals:cols.map(cl=>(r[cl.j]??"").trim())});return}
    const k=(r[keyCol]||"").trim();
    if(k&&(srCol>=0?/\d/.test(k):/[a-z]/i.test(k))&&cols.some(cl=>(r[cl.j]??"").trim()!==""))unmatched.push(k);
  });
  return{cols,items,unmatched};
}
function guessTask(c,h){
  const H=normT(h);if(!H)return"";
  const words=H.split(/[^a-z0-9]+/).filter(w=>w.length>=3&&!/^\d+$/.test(w));
  let best="",bsc=0;
  c.tasks.forEach(t=>{
    const tn=normT(t.name);if(!tn)return;
    let sc=H.includes(tn)?5:0;words.forEach(w=>{if(tn.includes(w))sc+=1});
    if(sc&&H.includes(normT(iloCode(c,t.iloId))))sc+=3;
    if(sc>bsc){bsc=sc;best=t.id}
  });
  return best;
}
function scorePreview(c,sec){
  const out=$("#scOut"),P=parseScorePaste(c,sec,$("#scTxt").value);
  if(P.error){out.innerHTML=`<div class="warnbox">${esc(P.error)}</div>`;return}
  const draw=()=>{
    const rep=$("#scReplace")?$("#scReplace").checked:true;
    let nNew=0,nRep=0,nSame=0,nBad=0,nKeep=0,nLock=0;
    const cell=(it,i)=>{
      const cl=P.cols[i],t=c.tasks.find(x=>x.id===cl.taskId),v=it.vals[i];
      if(!t)return`<td class="sm">–</td>`;
      if(isDrp(it.st))return`<td class="sm" title="Dropped student, skipped">DRP, skipped</td>`;
      if(!isGiven(sec,t)){if(v!=="")nLock++;return`<td class="sm" title="Mark this task Given for this section first">Not yet given, skipped</td>`}
      if(v==="")return`<td class="sm">–</td>`;
      const n=num(v),T=num(t.total),cur=it.st.scores?.[t.id];const has=num(cur)!==null;
      if(Number.isNaN(n)||n<0||(T>0&&n>T)){nBad++;return`<td class="cell-no" title="Invalid score">${esc(v)} ✗</td>`}
      if(has&&num(cur)===n){nSame++;return`<td class="num">${esc(v)}</td>`}
      if(has&&!rep){nKeep++;return`<td class="num sm" title="Existing score kept">${esc(cur)} (kept)</td>`}
      if(has){nRep++;return`<td class="num" style="background:var(--warn-bg)">${esc(cur)} → <b>${esc(v)}</b></td>`}
      nNew++;return`<td class="num"><b>${esc(v)}</b></td>`;
    };
    const used=P.cols.map(cl=>cl.taskId).filter(Boolean);const dup=used.filter((x,i)=>used.indexOf(x)!==i).length;
    const rowsH=P.items.map(it=>`<tr><td class="l num" style="white-space:nowrap">${esc(it.st.sr)}</td><td class="l">${esc(it.st.name)}</td>${P.cols.map((_,i)=>cell(it,i)).join("")}</tr>`).join("");
    out.innerHTML=`<div class="tw"><table><thead><tr><th class="l">SR-Code</th><th class="l">Name</th>${P.cols.map((cl,i)=>`<th style="min-width:150px;text-transform:none;letter-spacing:0">
        <select data-map="${i}" aria-label="Task for column ${i+1}"><option value="">— Skip column —</option>${c.tasks.map(t=>`<option value="${t.id}" ${t.id===cl.taskId?"selected":""}>${esc(taskLabel(c,t))} (/${esc(t.total)})</option>`).join("")}</select>

function midLive(c,sec,st){

    if(v===null){miss.push(t);return}if(Number.isNaN(v)||v<0||v>T){bad=true;return}acc+=(v/T*62.5+37.5)*w/100;W+=w});
  const basisW=tasks.reduce((a,t)=>a+num(t.weight),0),basis=tasks.map(t=>taskLabel(c,t)).join(", ");
  if(bad)return{status:"Check",basis,basisW};
  if(miss.length)return{status:"INC",miss:miss.map(t=>taskLabel(c,t)),basis,basisW};
  const pct=acc/basisW*100,grade=Math.floor(pct+1e-9);

}

}

function iloStats(c,sec){

    const att=scored.filter(x=>Math.floor(x.r.iloS[i.id]+1e-9)>=pass).length;

    const tasks=c.tasks.filter(t=>t.iloId===i.id);
    return{i,pass,target,tasks,n:scored.length,att,pct,result:pct===null?"Pending":pct>=target?"Met":"Not met"};
  });
  return{res,ilos};
}

function downloadCSV(rows,name){

/* ---------- exam analysis (estimated from total scores) ---------- */
const pLevel=v=>v>0.8?"Very easy":v>0.6?"Easy":v>0.4?"Moderate":v>0.2?"Difficult":"Very difficult";
const dLevel=d=>d>=0.4?"Very good":d>=0.3?"Good":d>=0.2?"Fair, revise":d>=0?"Poor":"Negative, check the exam";
const rLevel=r=>r>=0.9?"High":r>=0.8?"Good":r>=0.7?"Acceptable":"Low";
const mastery=m=>m>=75?"Mastered":m>=50?"Nearly mastered":"Least mastered";
function examStats(t,secs){
  const T=num(t.total);const S=[];secs.forEach(sec=>activeOf(sec).forEach(st=>{const v=scoreOf(t,st);if(v!==null)S.push(v)}));
  const N=S.length;if(!N||!(T>0))return{N,T};
  const mean=S.reduce((a,b)=>a+b,0)/N,varc=S.reduce((a,b)=>a+(b-mean)**2,0)/N,sd=Math.sqrt(varc);
  const srt=[...S].sort((a,b)=>b-a),g=Math.max(1,Math.round(N*0.27));
  const up=srt.slice(0,g).reduce((a,b)=>a+b,0)/g/T,lo=srt.slice(-g).reduce((a,b)=>a+b,0)/g/T;
  const passN=S.filter(v=>v/T>=0.6).length;
  const w=T/5,bins=[0,0,0,0,0];S.forEach(v=>bins[Math.min(4,Math.floor(v/w+1e-9))]++);
  const binLbl=[0,1,2,3,4].map(i=>{const a=Math.ceil(i*w-1e-9),b=i===4?T:Math.ceil((i+1)*w-1e-9)-1;return`${pc(a)}–${pc(b)}`});
  return{N,T,S,sum:S.reduce((a,b)=>a+b,0),mean,sd,varc,hi:srt[0],lo:srt[N-1],mps:mean/T*100,passN,g,up,low:lo,D:up-lo,bins,binLbl};
}
function seededRng(str){let h=1779033703^str.length;for(let i=0;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),3432918353);h=h<<13|h>>>19}
  let a=h>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function estimateItems(parts,X,mode,seedKey){
  const items=[];parts.forEach(pt=>{for(let i=0;i<pt.n;i++)items.push({p:pt.p})});
  const N=X.N,T=X.T,P=X.sum/(N*T),base=Math.max(0,Math.min(N,Math.floor(P*N+1e-9)));
  let R;
  if(mode==="random"){
    /* Randomized split: each item's share correct varies around the section's overall share, then counts are adjusted so the totals match the actual scores exactly. */
    const rnd=seededRng(seedKey);
    items.forEach(it=>{const z=(rnd()+rnd()+rnd()-1.5)*0.36;it.c=Math.max(0,Math.min(N,Math.round(Math.max(0.02,Math.min(0.98,P+z))*N)))});
    R=X.sum-items.reduce((a,it)=>a+it.c*it.p,0);
    for(let k=0;k<200000&&Math.abs(R)>1e-9;k++){
      const it=items[Math.floor(rnd()*items.length)];
      if(R>0&&it.c<N&&it.p<=R+1e-9){it.c++;R-=it.p}
      else if(R<0&&it.c>0&&it.p<=-R+1e-9){it.c--;R+=it.p}
      else if(!items.some(x=>R>0?x.c<N&&x.p<=R+1e-9:x.c>0&&x.p<=-R+1e-9))break;
    }
  }else{
    items.forEach(it=>it.c=base);R=X.sum-items.reduce((a,it)=>a+it.c*it.p,0);
    for(const it of items){if(R<it.p-1e-9)continue;if(it.c<N){it.c++;R-=it.p}}
  }
  items.forEach((it,i)=>{it.no=i+1;it.w=N-it.c;it.pv=it.c/N});
  return{items,diff:R};
}
function kr21(parts,X){
  const K=parts.reduce((a,x)=>a+x.n,0);if(K<2||!(X.varc>0))return null;
  const f=K/X.T,M=X.mean*f,V=X.varc*f*f;return{v:(K/(K-1))*(1-M*(K-M)/(K*V)),approx:parts.some(x=>x.p!==1)};
}

const DAYS=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
function schedList(sec){if(!Array.isArray(sec.schedules)){sec.schedules=sec.schedule&&sec.schedule.trim()?[{text:sec.schedule.trim(),free:true}]:[]}return sec.schedules}
function t12(v){if(!v)return"";const [h,m]=v.split(":").map(Number);return{t:`${(h%12)||12}:${String(m).padStart(2,"0")}`,ap:h<12?"AM":"PM"}}
function schedLine(x){
  if(x.text&&x.text.trim())return x.text.trim();
  const d=(x.days||[]).join("/"),a=t12(x.start),b=t12(x.end);
  const tm=a&&b?(a.ap===b.ap?`${a.t}–${b.t} ${b.ap}`:`${a.t} ${a.ap}–${b.t} ${b.ap}`):a?`${a.t} ${a.ap}`:"";
  return[d,tm].filter(Boolean).join(" ")+(x.note&&x.note.trim()?` (${x.note.trim()})`:"");
}
const schedText=sec=>schedList(sec).map(schedLine).filter(Boolean).join("; ");
function schedSummaryHTML(sec){const t=schedText(sec);return`<span class="stxt ${t?"":"none"}">${t?esc(t):"No schedule yet"}</span>`}

/* ---------- seat plan templates ---------- */
const SEAT_PH=[
  {token:"COURSE CODE – COURSE NAME",label:"Course",key:"code",val:V=>[V.code,V.title].filter(Boolean).join(" – ")},
  {token:"COURSE CODE - COURSE NAME",label:"Course",key:"code",val:V=>[V.code,V.title].filter(Boolean).join(" – ")},
  {token:"COURSE CODE",label:"Course code",key:"code",val:V=>V.code},
  {token:"COURSE NAME",label:"Course title",key:"title",val:V=>V.title},
  {token:"COURSE TITLE",label:"Course title",key:"title",val:V=>V.title},
  {token:"SECTION",label:"Section",key:"section",val:V=>V.section},
  {token:"YEAR LEVEL / SECTION",label:"Section",key:"section",val:V=>V.section},
  {token:"FACILITATOR NAME",label:"Facilitator",key:"instructor",val:V=>(V.instructor||"").toUpperCase()},
  {token:"INSTRUCTOR NAME",label:"Instructor",key:"instructor",val:V=>(V.instructor||"").toUpperCase()},
  {token:"SCHEDULE",label:"Schedule",key:"schedule",val:V=>V.schedule},
  {token:"COLLEGE",label:"College",key:"college",val:V=>V.college}
];
function analyzeSeatPlan(doc){
  const body=wAll(doc,"body")[0];if(!body)return null;
  let grid=null;
  wAll(body,"tbl").forEach(tbl=>{const rows=wKids(tbl,"tr");if(rows.length<2)return;const cells=rows.flatMap(r=>wKids(r,"tc"));if(cells.length<8)return;
    if(cells.some(tc=>wText(tc).trim()))return;const n=rows.length*wKids(rows[0],"tc").length;if(!grid||n>grid.n)grid={tbl,rows,n}});
  if(!grid)return null;
  const widths=wKids(grid.rows[0],"tc").map(tc=>+(wAll(tc,"tcW")[0]?.getAttributeNS(W_NS,"w")||0));
  const med=[...widths].sort((a,b)=>a-b)[Math.floor(widths.length/2)]||0;
  const seatCols=widths.map((w,i)=>[w,i]).filter(([w])=>!med||w>med*0.4).map(([,i])=>i);
  if(seatCols.length<2)return null;
  const ph=[];const seen=new Set();
  wAll(body,"p").forEach(p=>{const t=wText(p).trim();const m=SEAT_PH.find(x=>x.token===t);if(m&&!seen.has(m.label)){seen.add(m.label);ph.push(m)}});
  const fields={};ph.forEach(m=>fields[m.key]=true);
  return{kind:"seat",tbl:grid.tbl,seatRows:grid.rows,seatCols,ph,fields,examDates:[],colIdx:{section:undefined},sigP:null,rows:grid.rows,title:"Seat plan"};
}
function fillSeatPlan(doc,A,V){
  /* placeholders: a paragraph whose whole text is a token (text boxes appear twice in Word files, so every match is filled) */
  wAll(doc,"p").forEach(p=>{const t=wText(p).trim();const m=SEAT_PH.find(x=>x.token===t);if(!m)return;const v=m.val(V);if(!v)return;
    const ts=wAll(p,"t");ts.forEach((x,i)=>{x.textContent=i===0?v:""});if(ts[0])ts[0].setAttributeNS("http://www.w3.org/XML/1998/namespace","xml:space","preserve")});
  const rows=[...A.seatRows];
  const trH=r=>{const h=wAll(r,"trHeight")[0];return h?+h.getAttributeNS(W_NS,"val"):900};
  const total=rows.reduce((a,r)=>a+trH(r),0),orig=rows.length;
  while(rows.length*A.seatCols.length<V.students.length){const last=rows[rows.length-1],cl=last.cloneNode(true);last.parentNode.insertBefore(cl,last.nextSibling);rows.push(cl)}
  if(rows.length>orig){const h=Math.max(560,Math.floor(total/rows.length));rows.forEach(r=>{let pr=wKids(r,"trPr")[0];if(!pr){pr=doc.createElementNS(W_NS,"w:trPr");r.insertBefore(pr,r.firstChild)}let th=wKids(pr,"trHeight")[0];if(!th){th=doc.createElementNS(W_NS,"w:trHeight");pr.appendChild(th)}th.setAttributeNS(W_NS,"w:val",String(h))})}
  const mkRun=(text,bold)=>{const r=doc.createElementNS(W_NS,"w:r"),rp=doc.createElementNS(W_NS,"w:rPr");if(bold)rp.appendChild(doc.createElementNS(W_NS,"w:b"));["sz","szCs"].forEach(n=>{const e=doc.createElementNS(W_NS,"w:"+n);e.setAttributeNS(W_NS,"w:val","16");rp.appendChild(e)});r.appendChild(rp);
    const t=doc.createElementNS(W_NS,"w:t");t.setAttributeNS("http://www.w3.org/XML/1998/namespace","xml:space","preserve");t.textContent=text;r.appendChild(t);return r};
  let k=0;
  const order=V.seatOrder==="top"?rows:[...rows].reverse();
  /* S-pattern: the first row runs left to right, the next right to left, and so on */
  order.forEach((r,ri)=>{const cs=wKids(r,"tc");(ri%2?[...A.seatCols].reverse():A.seatCols).forEach(ci=>{const tc=cs[ci];if(!tc)return;let p=wKids(tc,"p")[0];if(!p){p=doc.createElementNS(W_NS,"w:p");tc.appendChild(p)}

    const i=st.name.indexOf(","),sur=i>=0?st.name.slice(0,i).trim():st.name.trim(),giv=i>=0?st.name.slice(i+1).trim():"";
    p.appendChild(mkRun(sur,true));
    if(giv){const br=doc.createElementNS(W_NS,"w:r");br.appendChild(doc.createElementNS(W_NS,"w:br"));p.appendChild(br);p.appendChild(mkRun(giv,false))}
  })});
}

/* ---------- share and import course setups ---------- */
const SETUP_PREFIX="CRSETUP1.";
function setupPayload(c){
  return{app:"batstateu-class-record-setup",version:1,exportedAt:new Date().toISOString(),
    course:{code:c.code||"",desc:c.desc||"",defPass:c.defPass??75,defTarget:c.defTarget??70,
      ilos:c.ilos.map(i=>({id:i.id,code:i.code||"",desc:i.desc||"",pass:i.pass??"",target:i.target??""})),
      tasks:c.tasks.map(t=>({id:t.id,name:t.name||"",iloId:t.iloId||"",weight:t.weight??"",total:t.total??"",...(Array.isArray(t.parts)&&t.parts.length?{parts:t.parts}:{}),...(t.grp&&t.grp.id?{grp:{id:t.grp.id,w:t.grp.w??"",mode:t.grp.mode||"points",v:t.grp.v??""}}:{})}))}};
}
function setupCode(c){const json=JSON.stringify(setupPayload(c));const u8=new TextEncoder().encode(json);return SETUP_PREFIX+bytesToB64(u8)}
function parseSetup(text){
  text=String(text||"").trim();if(!text)throw new Error("Paste a setup code or choose a setup file first.");
  let d;
  if(text.startsWith(SETUP_PREFIX)){try{d=JSON.parse(new TextDecoder().decode(b64ToBytes(text.slice(SETUP_PREFIX.length).replace(/\s+/g,""))))}catch(e){throw new Error("This setup code is incomplete or damaged. Ask for it again, or use the setup file.")}}
  else{try{d=JSON.parse(text)}catch(e){throw new Error("This is not a setup code or setup file.")}}
  if(d&&Array.isArray(d.courses))throw new Error("This is a full backup file. Use Restore under Backup instead.");
  const s=d&&d.course;
  if(!d||d.app!=="batstateu-class-record-setup"||!s||!Array.isArray(s.tasks)||!Array.isArray(s.ilos))throw new Error("This is not a Class Record setup.");
  return s;
}
function buildFromSetup(s){
  const map={};const ilos=s.ilos.map(i=>{const id=uid();map[i.id]=id;return{id,code:String(i.code||""),desc:String(i.desc||""),pass:i.pass??"",target:i.target??""}});
  const gmap={};
  const tasks=s.tasks.map(t=>{const o={id:uid(),name:String(t.name||""),iloId:map[t.iloId]||"",weight:t.weight??"",total:t.total??""};if(t.grp&&t.grp.id)o.grp={id:gmap[t.grp.id]||(gmap[t.grp.id]=uid()),w:t.grp.w??"",mode:t.grp.mode==="percent"?"percent":"points",v:t.grp.v??""};if(Array.isArray(t.parts)&&t.parts.every(x=>Number.isInteger(+x.n)&&+x.p>0))o.parts=t.parts.map(x=>({n:+x.n,p:+x.p}));return o});
  return{ilos,tasks,defPass:s.defPass??75,defTarget:s.defTarget??70};
}

/* ---------- course setup: assessment tasks editor ---------- */

function renderBreakdown(c,el,E){
  if(!el)return;
  if(!E.length||!c.ilos.length){el.hidden=true;return}el.hidden=false;
  const tot={};c.ilos.forEach(i=>tot[i.id]=0);let none=0;const noIlo=[];
  const rows=E.map(e=>{const cells={};let any=false;
    e.members.forEach(m=>{const w=num(m.weight)>0?num(m.weight):0;if(m.iloId&&tot[m.iloId]!==undefined){cells[m.iloId]=(cells[m.iloId]||0)+w;tot[m.iloId]+=w;any=true}});
    if(!any){const w=entryWeight(e);if(w){none+=w;noIlo.push(e.members[0].name||"Untitled task")}}
    return{e,cells}});
  const sum=Object.values(tot).reduce((a,b)=>a+b,0)+none,ok=Math.abs(sum-100)<1e-6&&!none;
  el.innerHTML=`<h2>Weight breakdown by ILO</h2><p class="hint">Computed from the tasks above. Compare it with your syllabus before the term starts.</p>
    <div class="tw"><table><thead><tr><th class="l">Task</th><th>Weight</th>${c.ilos.map(i=>`<th><span class="sq" style="background:${iloColor(c,i.id)}"></span> ${esc(i.code)}</th>`).join("")}</tr></thead><tbody>
    ${rows.map(({e,cells})=>`<tr><td class="l">${esc(e.members[0].name||"Untitled task")}</td><td class="num"><b>${wFmt(entryWeight(e))}%</b></td>${c.ilos.map(i=>`<td class="num">${cells[i.id]?wFmt(cells[i.id])+"%":""}</td>`).join("")}</tr>`).join("")}
    <tr class="bdtot"><td class="l">Total</td><td class="num ${Math.abs(weightSum(c)-100)<1e-6?"okc":"noc"}">${wFmt(weightSum(c))}%${Math.abs(weightSum(c)-100)<1e-6?" ✓":""}</td>${c.ilos.map(i=>`<td class="num">${wFmt(tot[i.id])}%</td>`).join("")}</tr></tbody></table></div>
    <div class="wbar big">${c.ilos.map(i=>tot[i.id]?`<span style="width:${tot[i.id]}%;background:${iloColor(c,i.id)}" title="${esc(i.code)} ${wFmt(tot[i.id])}%"></span>`:"").join("")}${none?`<span style="width:${none}%;background:var(--line)" title="No ILO ${wFmt(none)}%"></span>`:""}</div>
    <div class="legend">${c.ilos.map(i=>`<span><i style="background:${iloColor(c,i.id)}"></i>${esc(i.code)} ${wFmt(tot[i.id])}%</span>`).join("")}</div>
    ${!ok?`<div class="warnbox">${[Math.abs(weightSum(c)-100)>1e-6?`Task weights add up to ${wFmt(weightSum(c))}%. Final grades appear only when they total 100%.`:"",none?`${esc(noIlo.join(", "))} ${noIlo.length===1?"has":"have"} no ILO, so ${wFmt(none)}% is not counted toward any ILO.`:""].filter(Boolean).join("<br>")}</div>`:""}`;
}

  $("#f-dt").oninput=e=>{c.defTarget=e.target.value;dirty(c);tc.querySelectorAll('[data-k="target"]').forEach(i=>i.placeholder=e.target.value)};
  tc.querySelectorAll("tr[data-ilo]").forEach(tr=>{const i=c.ilos.find(x=>x.id===tr.dataset.ilo);
    tr.querySelectorAll("[data-k]").forEach(inp=>inp.oninput=()=>{i[inp.dataset.k]=inp.value;dirty(c);if(inp.dataset.k==="code")tc.querySelectorAll(`select[data-k="iloId"] option[value="${i.id}"]`).forEach(o=>o.textContent=inp.value||"ILO")});
    const rm=tr.querySelector("[data-rm]");rm.onclick=()=>arm(rm,()=>{c.ilos=c.ilos.filter(x=>x.id!==i.id);c.tasks.slice().forEach(t=>{if(t.iloId!==i.id)return;if(t.grp)removePart(c,t);else t.iloId=""});dirty(c);renderMain()},"Remove")});
  tc.querySelectorAll("tr[data-gt]").forEach(tr=>{const id=tr.dataset.gt;
    const M=groupOfTask(c,c.tasks.find(x=>x.id===id));
    tr.querySelectorAll("[data-gs]").forEach(cb=>cb.onchange=()=>{const s=c.sections.find(x=>x.id===cb.dataset.gs);s.given=s.given||{};M.forEach(m=>{if(cb.checked)s.given[m.id]=true;else delete s.given[m.id]});dirty(c);const all=c.sections.every(x=>x.given&&x.given[id]);tr.querySelector("[data-gall]").textContent=all?"Clear all":"All sections"});
    tr.querySelector("[data-gall]").onclick=()=>{const all=c.sections.every(x=>x.given&&x.given[id]);c.sections.forEach(x=>{x.given=x.given||{};M.forEach(m=>{if(all)delete x.given[m.id];else x.given[m.id]=true})});dirty(c);renderMain()}});
  tc.querySelectorAll("tr[data-sec]").forEach(tr=>{const s=c.sections.find(x=>x.id===tr.dataset.sec);
    tr.querySelector("[data-k]").oninput=e=>{s.name=e.target.value;dirty(c)};
    tr.querySelector("[data-sk]").onclick=()=>editSchedule(c,s,()=>renderMain());
    const rm=tr.querySelector("[data-rm]");rm.onclick=()=>arm(rm,()=>{c.sections=c.sections.filter(x=>x.id!==s.id);dirty(c);renderMain()},s.students.length?`Delete ${s.students.length} students?`:"Delete")});
  $("#addIlo").onclick=()=>{c.ilos.push({id:uid(),code:`ILO${c.ilos.length+1}`,desc:"",pass:"",target:""});dirty(c);renderMain()};
  $("#addSec").onclick=()=>{c.sections.push({id:uid(),name:`Section ${c.sections.length+1}`,students:[],given:{}});dirty(c);renderMain()};
  $("#shFile").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(setupPayload(c),null,1)],{type:"application/json"}));a.download=`${(c.code||"course").replace(/[^\w-]+/g,"_")}_setup.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);toast("Setup file downloaded.")};
  $("#shCode").onclick=()=>{const code=setupCode(c),box=$("#shCodeBox");box.value=code;box.hidden=false;
    const done=()=>toast("Setup code copied. Paste it in a message to your co-faculty.");const fallback=()=>{box.focus();box.select();toast("Select the code below and copy it (Ctrl + C).")};
    try{navigator.clipboard.writeText(code).then(done,fallback)}catch(e){fallback()}};
  if($("#shImp"))$("#shImp").onclick=()=>openImportSetup(c);
  bindGs(c);
  const del=$("#delCourse");del.onclick=()=>arm(del,async()=>{
    const id=c.id;courses=courses.filter(x=>x.id!==id);pending.delete(id);view.courseId=courses[0]?.id||null;view.tab="record";view.sectionId=null;saveView();render();
    try{await store.remove(id);toast("Course deleted.")}catch(e){toast("Could not delete. Check your connection.")}
  },"Tap again to delete the course");
}

boot();
</script>
</body>
</html>
